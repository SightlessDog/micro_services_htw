services:
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_ZITADEL_ISSUER: "http://${ZITADEL_EXTERNALDOMAIN}:${ZITADEL_EXTERNALPORT}"
      VITE_ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
      VITE_ZITADEL_ORG_ID: ${ZITADEL_ORG_ID}
      GATEWAY_URL: "http://gateway:80"
      NGINX_ENVSUBST_FILTER: "^GATEWAY_URL$"
    ports:
      - "5173:80"
    depends_on:
      - gateway
    networks:
      - crate-net

  gateway:
    image: nginx:alpine
    environment:
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT}
      # Service URLs for local dev (docker network names).
      # Cloud Run overrides these with actual Cloud Run URIs via Pulumi.
      USER_SERVICE_URL: "http://user-service:8000"
      PRODUCT_SERVICE_URL: "http://product-service:8081"
      ORDER_SERVICE_URL: "http://order-service:3000"
      ZITADEL_PROXY_URL: "http://zitadel:8080"
      ZITADEL_HOST_HEADER: "${ZITADEL_EXTERNALDOMAIN}:${ZITADEL_EXTERNALPORT}"
      # Substitute service URL vars + all ZITADEL_* vars; leave nginx's own
      # $host/$remote_addr etc. untouched.
      NGINX_ENVSUBST_FILTER: "^ZITADEL_|_SERVICE_URL$"
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/templates:/etc/nginx/templates:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - crate-net

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - crate-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9999:8080"
    networks:
      - crate-net
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ── Mail catcher (dev SMTP) ──────────────────────────────────────────────────
  maildev:
    image: maildev/maildev:latest
    expose:
      - "1025"
    ports:
      - "1080:1080"
    networks:
      - crate-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1080"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity Provider (Zitadel) ────────────────────────────────────────────
  zitadel-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${POSTGRES_ZITADEL_PASS}
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    networks:
      - crate-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 5s
      timeout: 5s
      retries: 10

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    user: "0"
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_ZITADEL_PASS}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ZITADEL_PASS}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY}
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      # Bootstrap a service account PAT for the login container on first init
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      # Enable Login V2 and point browser redirects to the login container (port 8082)
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: "http://localhost:8082/ui/v2/login/"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: "http://localhost:8082/ui/v2/login/login?authRequest="
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: "http://localhost:8082/ui/v2/login/logout?post_logout_redirect="
    depends_on:
      zitadel-db:
        condition: service_healthy
    ports:
      - "8081:8080"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks:
      - crate-net
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:latest
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      # Backend calls from login → API must carry Host: localhost so Zitadel
      # resolves the correct instance (keyed to ZITADEL_EXTERNALDOMAIN=localhost)
      CUSTOM_REQUEST_HEADERS: "Host:localhost,X-Forwarded-Proto:http"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    ports:
      - "8082:3000"
    networks:
      - crate-net
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

  # ── Databases ──────────────────────────────────────────────────────────────
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASS}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - crate-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: ${POSTGRES_PRODUCT_PASS}
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - crate-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${POSTGRES_ORDER_PASS}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - crate-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Services ───────────────────────────────────────────────────────────────
  user-service:
    build: ./user-service
    expose:
      - "8000"
    environment:
      ZITADEL_ISSUER: "http://${ZITADEL_EXTERNALDOMAIN}:${ZITADEL_EXTERNALPORT}"
      ZITADEL_AUDIENCE: ${ZITADEL_CLIENT_ID}
      ZITADEL_JWKS_URL: "http://gateway/oauth/v2/keys"
      ZITADEL_USERINFO_URL: "http://gateway/oidc/v1/userinfo"
      DATABASE_URL: "postgresql://user_user:${POSTGRES_USER_PASS}@user-db:5432/userdb"
    depends_on:
      user-db:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    networks:
      - crate-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://product-db:5432/productdb"
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PRODUCT_PASS}
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      ZITADEL_ISSUER: "http://${ZITADEL_EXTERNALDOMAIN}:${ZITADEL_EXTERNALPORT}"
      ZITADEL_AUDIENCE: ${ZITADEL_CLIENT_ID}
      ZITADEL_JWKS_URL: "http://gateway/oauth/v2/keys"
      ZITADEL_USERINFO_URL: "http://gateway/oidc/v1/userinfo"
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    networks:
      - crate-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8081/actuator/health | grep -q ''"status":"UP"''',
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  order-service:
    build: ./order-service
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://order_user:${POSTGRES_ORDER_PASS}@order-db:5432/orderdb"
      USER_SERVICE_URL: "http://user-service:8000"
      PRODUCT_SERVICE_URL: "http://product-service:8081"
      ZITADEL_ISSUER: "http://${ZITADEL_EXTERNALDOMAIN}:${ZITADEL_EXTERNALPORT}"
      ZITADEL_AUDIENCE: ${ZITADEL_CLIENT_ID}
      ZITADEL_JWKS_URL: "http://gateway/oauth/v2/keys"
      ZITADEL_USERINFO_URL: "http://gateway/oidc/v1/userinfo"
      PORT: "3000"
      KAFKA_BROKERS: "kafka:29092"
    depends_on:
      order-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    networks:
      - crate-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build: ./notification-service
    expose:
      - "3001"
    environment:
      KAFKA_BROKERS: "kafka:29092"
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_FROM: "CRATE <noreply@crate.local>"
      PORT: "3001"
    depends_on:
      kafka:
        condition: service_healthy
      maildev:
        condition: service_healthy
    networks:
      - crate-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  crate-net:
    driver: bridge

volumes:
  kafka-data:
  zitadel-bootstrap:
  zitadel-db-data:
  user-db-data:
  product-db-data:
  order-db-data:
