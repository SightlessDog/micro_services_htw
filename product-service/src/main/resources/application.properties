server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:product_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:product_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

zitadel.issuer=${ZITADEL_ISSUER:http://localhost:8081}
zitadel.jwks-uri=${ZITADEL_JWKS_URL:http://zitadel:8080/oauth/v2/keys}
zitadel.userinfo-uri=${ZITADEL_USERINFO_URL:http://gateway/oidc/v1/userinfo}
zitadel.audience=${ZITADEL_AUDIENCE}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=product-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
