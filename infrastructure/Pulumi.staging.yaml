# Stack config for the staging environment (develop branch).
# Secrets must be set separately with: pulumi config set --secret <key> <value> --stack staging
#
# Required secrets (run these once after stack init):
#   pulumi config set --secret neonUserDbUrl "postgresql://..."     --stack staging
#   pulumi config set --secret neonOrderDbUrl "postgresql://..."    --stack staging
#   pulumi config set --secret neonProductJdbcUrl "jdbc:postgresql://..." --stack staging
#   pulumi config set --secret neonProductDbUser "..."              --stack staging
#   pulumi config set --secret neonProductDbPass "..."              --stack staging
#   pulumi config set --secret kafkaBrokers "host:9092"             --stack staging
#   pulumi config set --secret kafkaUsername "..."                  --stack staging
#   pulumi config set --secret kafkaPassword "..."                  --stack staging
#   pulumi config set --secret resendApiKey "re_..."                --stack staging
