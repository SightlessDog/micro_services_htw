name: Deploy → Production

on:
  push:
    branches: [main]

env:
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev
  PULUMI_STACK: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push images
        run: |
          IMAGE_TAG="prod-${GITHUB_SHA::7}"
          REPO="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT }}/ecommerce"

          for SERVICE in frontend gateway user-service product-service order-service notification-service; do
            echo "Building $SERVICE..."
            docker build -t "$REPO/$SERVICE:$IMAGE_TAG" "./$SERVICE"
            docker push "$REPO/$SERVICE:$IMAGE_TAG"
          done

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy with Pulumi
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK }}
          work-dir: infrastructure
          config-map: |
            {
              "ecommerce-infra:imageTag": {
                "value": "${{ env.IMAGE_TAG }}",
                "secret": false
              }
            }
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
