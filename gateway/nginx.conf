events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Shared rate limit for proxied API + identity endpoints.
    limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=20r/s;

    upstream user_service {
        server user-service:8000;
    }

    upstream product_service {
        server product-service:8081;
    }

    upstream order_service {
        server order-service:3000;
    }

    # Server block lives in templates/default.conf.template — it needs
    # ZITADEL_EXTERNALDOMAIN/PORT substituted at container start.
    include /etc/nginx/conf.d/*.conf;
}
