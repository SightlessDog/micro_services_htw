events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Cloud Run / Google Frontend upstream responses carry larger headers
    # than nginx's 4k/8k defaults — bump buffers to avoid 502s.
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 24k;

    # Shared rate limit for proxied API + identity endpoints.
    limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=20r/s;

    # Upstreams injected via env vars at container start (envsubst).
    # Same image works for local Docker (http://user-service:8000)
    # and Cloud Run (https://staging-user-service-xxx.run.app).
    # NGINX_ENVSUBST_FILTER="^ZITADEL_|_SERVICE_URL$" controls what gets substituted.

    # Server block lives in templates/default.conf.template.
    include /etc/nginx/conf.d/*.conf;
}
